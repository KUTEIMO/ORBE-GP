<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración — Orbe360</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230284c7'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/plataforma/admin-shell.css">
</head>
<body class="admin">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="admin-top">
    <a class="brand" href="/">ORBE<span>360</span></a>
    <nav><a href="/">Volver al sitio</a></nav>
  </header>
  <main id="main" class="login-shell">
    <h1>Administración Orbe360</h1>
    <p class="lede">Gestiona las experiencias virtuales de tu organización.</p>

    <div class="warn-box" id="loginConnWarn" role="alert" hidden>
      <p style="margin:0 0 0.5rem" id="loginConnWarnText"></p>
      <div class="cta-row" style="margin-top:0.5rem">
        <button type="button" class="btn btn--tiny" id="loginRetryBtn">Reintentar conexión</button>
        <button type="button" class="btn btn--tiny btn--ghost" id="loginResetConnBtn">Usar otra cuenta</button>
      </div>
    </div>

    <section class="card" id="activeSessionCard" hidden aria-live="polite">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
        <strong style="font-size:1rem">Sesión activa</strong>
        <span class="badge badge--ok" id="activeRoleBadge">—</span>
      </div>
      <p style="margin:0 0 0.2rem;font-weight:600" id="activeUserLine">—</p>
      <p class="hint" style="margin:0 0 1rem" id="activeEmailLine">—</p>
      <div class="warn-box" id="activeReturnNotice" hidden></div>
      <div class="cta-row" id="activeSessionActions"></div>
      <div style="margin-top:1rem;padding-top:0.85rem;border-top:1px solid var(--orbe-line);display:flex;justify-content:flex-end">
        <button type="button" class="btn btn--ghost" id="btnSwitchAccount">Cerrar sesión y cambiar de cuenta</button>
      </div>
    </section>

    <form class="card" id="loginForm" hidden>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="tu@organizacion.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary" type="submit" id="submitBtn">Entrar</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <aside id="demoCreds" hidden aria-hidden="true"></aside>
  </main>
  <script src="/plataforma/config.js"></script>
  <script type="module">
    import { apiMutation, apiQuery, fetchMe, setToken, getToken, clearToken } from "/plataforma/convex-client.js";
    import { controlWebHref, orgAdminHref, DEFAULT_TOUR_SLUG } from "/src/tourSlug.js";

    const status = document.getElementById("status");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const formEl = document.getElementById("loginForm");
    const activeCard = document.getElementById("activeSessionCard");
    const connWarn = document.getElementById("loginConnWarn");
    const connWarnText = document.getElementById("loginConnWarnText");

    const params = new URLSearchParams(location.search);
    const isSwitch = params.get("switch") === "1";
    const rawReturn = params.get("return");
    const returnUrl = (() => {
      if (
        !rawReturn ||
        !rawReturn.startsWith("/") ||
        rawReturn.startsWith("//") ||
        rawReturn.includes("\\") ||
        rawReturn.includes("://") ||
        rawReturn.includes("/plataforma/login")
      ) {
        return null;
      }
      try {
        const parsed = new URL(rawReturn, location.origin);
        return parsed.origin === location.origin
          ? `${parsed.pathname}${parsed.search}${parsed.hash}`
          : null;
      } catch {
        return null;
      }
    })();

    function isReturnAllowedForUser(url, me) {
      if (!url || !me) return false;
      if (me.isSuperadmin && url.includes("control-web")) return false;
      if (me.isSuperadmin && url.includes("org-admin")) return false;
      if (!me.isSuperadmin && url.includes("superadmin")) return false;
      if (!me.isSuperadmin) {
        const cleanPath = url.split("?")[0].split("#")[0];
        const parts = cleanPath.split("/").filter(Boolean);
        const targetOrg = parts[0]?.toLowerCase() || "";
        const isTenantRoute =
          (parts.length >= 2 && parts[1] === "org-admin.html") ||
          (parts.length >= 3 && parts[2] === "control-web");
        if (isTenantRoute) {
          const memberships = Array.isArray(me.memberships) ? me.memberships : [];
          const hasOrg = memberships.some(
            (m) => String(m.orgSlug || "").toLowerCase() === targetOrg
          );
          if (!hasOrg) return false;
        }
      }
      return true;
    }

    async function resolveUserDestinations(token, me) {
      if (me.isSuperadmin) {
        return {
          roleLabel: "Superadmin",
          homeHref: "/plataforma/superadmin.html",
          homeLabel: "Ir al panel de plataforma",
          extraLinks: [],
        };
      }

      const memberships = Array.isArray(me.memberships) ? me.memberships : [];
      if (memberships.length === 0) {
        return {
          roleLabel: "Sin organización asignada",
          homeHref: "/",
          homeLabel: "Volver al inicio",
          extraLinks: [],
        };
      }

      const orgs = await apiQuery("organizations:listOrganizations", {
        token,
        now: Date.now(),
      }).catch(() => []);
      const adminM = memberships.find((m) => m.role === "orgAdmin");
      const primaryOrg = orgs?.find((o) => o.slug === (adminM?.orgSlug || memberships[0]?.orgSlug)) || orgs?.[0];
      const primaryOrgSlug = adminM?.orgSlug || memberships[0]?.orgSlug || primaryOrg?.slug || null;
      const primaryOrgId = adminM?.organizationId || memberships[0]?.organizationId || primaryOrg?.id || null;
      const orgTitle = primaryOrg?.name || adminM?.orgName || primaryOrgSlug || "la organización";
      const tours = primaryOrgId
        ? await apiQuery("organizations:listTours", {
            token,
            organizationId: primaryOrgId,
            now: Date.now(),
          }).catch(() => [])
        : [];
      const primaryTour =
        tours.find((t) => t.slug === DEFAULT_TOUR_SLUG) || tours[0] || null;

      if (adminM) {
        const homeHref = primaryOrgSlug ? orgAdminHref(primaryOrgSlug) : "/";
        const cw =
          primaryOrgSlug && primaryTour
            ? controlWebHref({ orgSlug: primaryOrgSlug, tourSlug: primaryTour.slug })
            : null;
        return {
          roleLabel: "Admin Org",
          homeHref,
          homeLabel: primaryOrgSlug ? `Ir al panel (${orgTitle})` : "Ir al inicio",
          extraLinks: cw ? [{ href: cw, label: "Abrir Control Web" }] : [],
        };
      }

      const editorOrgSlug = primaryOrgSlug;
      const cw =
        editorOrgSlug && primaryTour
          ? controlWebHref({ orgSlug: editorOrgSlug, tourSlug: primaryTour.slug })
          : null;
      return {
        roleLabel: "Editor",
        homeHref: cw || (editorOrgSlug ? orgAdminHref(editorOrgSlug) : "/"),
        homeLabel: cw ? "Abrir Control Web" : "Ver tours asignados",
        extraLinks: editorOrgSlug ? [{ href: orgAdminHref(editorOrgSlug), label: "Ver panel de organización" }] : [],
      };
    }

    async function signOutCurrent(tokenToRevoke) {
      if (tokenToRevoke) {
        try {
          await apiMutation("auth:logout", { token: tokenToRevoke });
        } catch (_e) {
          /* ignore remote failure on sign out */
        }
      }
      clearToken();
    }

    let currentSessionToken = null;

    function renderActiveSession(me, token, dest) {
      currentSessionToken = token;
      activeCard.hidden = false;
      formEl.hidden = true;
      document.getElementById("activeRoleBadge").textContent = dest.roleLabel;
      document.getElementById("activeUserLine").textContent = me.name || me.email;
      document.getElementById("activeEmailLine").textContent = me.email;

      const returnNotice = document.getElementById("activeReturnNotice");
      const canReturn = isReturnAllowedForUser(returnUrl, me);
      if (returnUrl && !canReturn) {
        returnNotice.hidden = false;
        returnNotice.textContent = me.isSuperadmin
          ? "La sección solicitada corresponde a una organización y no está disponible para cuentas de plataforma."
          : "Tu cuenta actual no tiene acceso a la vista solicitada.";
      } else {
        returnNotice.hidden = true;
      }

      const actionsEl = document.getElementById("activeSessionActions");
      actionsEl.replaceChildren();

      const homeBtn = document.createElement("a");
      homeBtn.className = "btn btn--primary";
      homeBtn.href = dest.homeHref;
      homeBtn.textContent = dest.homeLabel;
      actionsEl.appendChild(homeBtn);

      if (canReturn && returnUrl !== dest.homeHref) {
        const backBtn = document.createElement("a");
        backBtn.className = "btn btn--ghost";
        backBtn.href = returnUrl;
        backBtn.textContent = returnUrl.includes("control-web")
          ? "Volver a Control Web"
          : returnUrl.includes("org-admin")
            ? "Volver al panel"
            : "Continuar";
        actionsEl.appendChild(backBtn);
      }

      for (const extra of dest.extraLinks) {
        if (extra.href === returnUrl || extra.href === dest.homeHref) continue;
        const a = document.createElement("a");
        a.className = "btn btn--ghost";
        a.href = extra.href;
        a.textContent = extra.label;
        actionsEl.appendChild(a);
      }
    }

    document.getElementById("btnSwitchAccount")?.addEventListener("click", async () => {
      await signOutCurrent(currentSessionToken || getToken());
      currentSessionToken = null;
      activeCard.hidden = true;
      formEl.hidden = false;
      status.textContent = "Sesión cerrada. Ingresa con otra cuenta.";
      status.classList.remove("error");
      emailEl.focus();
    });

    async function checkExistingSession() {
      connWarn.hidden = true;
      const existing = getToken();
      if (!existing) {
        activeCard.hidden = true;
        formEl.hidden = false;
        return;
      }
      try {
        const me = await fetchMe(existing);
        if (!me) {
          clearToken();
          activeCard.hidden = true;
          formEl.hidden = false;
          return;
        }
        const dest = await resolveUserDestinations(existing, me);
        if (returnUrl && !isSwitch && isReturnAllowedForUser(returnUrl, me)) {
          location.href = returnUrl;
          return;
        }
        renderActiveSession(me, existing, dest);
      } catch (err) {
        activeCard.hidden = true;
        formEl.hidden = true;
        connWarn.hidden = false;
        connWarnText.textContent = err?.message || "No se pudo conectar con el servidor para verificar tu sesión.";
      }
    }

    document.getElementById("loginRetryBtn")?.addEventListener("click", () => {
      void checkExistingSession();
    });
    document.getElementById("loginResetConnBtn")?.addEventListener("click", () => {
      clearToken();
      connWarn.hidden = true;
      activeCard.hidden = true;
      formEl.hidden = false;
      emailEl.focus();
    });

    await checkExistingSession();

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Verificando credenciales…";
      status.classList.remove("error");
      try {
        const previousToken = getToken();
        const email = emailEl.value.trim().toLowerCase();
        const password = passEl.value.trim();
        const result = await apiMutation("auth:login", { email, password });
        if (!result?.ok) {
          throw new Error(result?.error || "Credenciales inválidas. Verifica tu correo y contraseña.");
        }
        if (previousToken && previousToken !== result.token) {
          await signOutCurrent(previousToken);
        }
        setToken(result.token);
        status.textContent = `Bienvenido, ${result.user.name}`;

        const me = (await fetchMe(result.token).catch(() => null)) || {
          ...result.user,
          memberships: [],
        };
        if (returnUrl && isReturnAllowedForUser(returnUrl, me)) {
          location.href = returnUrl;
          return;
        }
        const dest = await resolveUserDestinations(result.token, me);
        location.href = dest.homeHref;
      } catch (error) {
        status.textContent = error.message || "No se pudo iniciar sesión";
        status.classList.add("error");
      }
    });
  </script>
</body>
</html>
