<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración — Orbe360</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/plataforma/admin-shell.css">
</head>
<body class="admin">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="admin-top">
    <a class="brand" href="/">ORBE<span>360</span></a>
    <nav><a href="/">Volver al sitio</a></nav>
  </header>
  <main id="main" class="login-shell">
    <h1>Administración Orbe360</h1>
    <p class="lede">Gestiona las experiencias virtuales de tu organización.</p>
    <form class="card" id="loginForm">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="tu@organizacion.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary" type="submit" id="submitBtn">Entrar</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </main>
  <script src="/plataforma/config.js"></script>
  <script type="module">
    import { apiMutation, apiQuery, fetchMe, setToken, getToken } from "/plataforma/convex-client.js";
    import { orgAdminHref } from "/src/tourSlug.js";

    const status = document.getElementById("status");
    const existing = getToken();
    const params = new URLSearchParams(location.search);
    const rawReturn = params.get("return");
    const returnUrl =
      rawReturn &&
      rawReturn.startsWith("/") &&
      !rawReturn.startsWith("//") &&
      !rawReturn.includes("://")
        ? rawReturn
        : null;

    async function resolveOrgAdminHome(token) {
      try {
        const orgs = await apiQuery("organizations:listOrganizations", {
          token,
          now: Date.now(),
        });
        if (orgs?.length) return orgAdminHref(orgs[0].slug);
      } catch (_e) {
        /* fall through */
      }
      return "/unisimoncucuta/org-admin.html";
    }

    if (existing) {
      try {
        const me = await fetchMe(existing);
        if (me) {
          if (returnUrl) {
            location.href = returnUrl;
          } else if (me.isSuperadmin) {
            location.href = "/plataforma/superadmin.html";
          } else {
            const home = await resolveOrgAdminHome(existing);
            if (home) location.href = home;
          }
        }
      } catch (_e) { /* stay on login */ }
    }

    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const formEl = document.getElementById("loginForm");

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Verificando credenciales…";
      status.classList.remove("error");
      try {
        const email = emailEl.value.trim().toLowerCase();
        const password = passEl.value.trim();
        const result = await apiMutation("auth:login", { email, password });
        if (!result?.ok) {
          throw new Error(result?.error || "Credenciales inválidas. Verifica tu correo y contraseña.");
        }
        setToken(result.token);
        status.textContent = `Bienvenido, ${result.user.name}`;
        if (returnUrl) {
          location.href = returnUrl;
          return;
        }
        if (result.user.isSuperadmin) {
          location.href = "/plataforma/superadmin.html";
          return;
        }
        const home = await resolveOrgAdminHome(result.token);
        location.href = home || "/unisimoncucuta/org-admin.html";
      } catch (error) {
        status.textContent = error.message || "No se pudo iniciar sesión";
        status.classList.add("error");
      }
    });
  </script>
</body>
</html>
